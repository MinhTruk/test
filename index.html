<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a1c">
<title>SaveLab – Bộ công cụ file save game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070a1c; --bg2:#0d1230; --ink:#eef1ff; --mut:#9aa4d6;
  --cy:#2ee6ff; --mg:#ff3da6; --am:#ffc247; --vi:#8a5bff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:radial-gradient(1200px 800px at 20% -10%,#1b1f5e 0%,transparent 60%),
             radial-gradient(1000px 700px at 100% 10%,#4a0f48 0%,transparent 55%),var(--bg);
  color:var(--ink);font-family:"Lexend","Segoe UI",Roboto,system-ui,sans-serif;
  min-height:100vh;overflow-x:hidden;
}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.blob{position:fixed;z-index:0;pointer-events:none;opacity:.3}
.blob img{display:block;width:100%;height:100%}
.wrap{position:relative;z-index:2;max-width:1200px;margin:0 auto;padding:0 22px 80px}

/* HERO */
.hero{min-height:92vh;display:grid;place-items:center;text-align:center;padding-top:40px;position:relative}
.emblem{position:relative;width:min(300px,62vw);aspect-ratio:1;margin:0 auto 18px;animation:emIn 1.1s cubic-bezier(.2,1.3,.3,1) both}
.emblem .core{position:absolute;inset:0;width:100%;height:100%;animation:floaty 6s ease-in-out infinite}
.emblem .orb{position:absolute;width:26%;height:26%;left:37%;top:37%;border-radius:50%;overflow:hidden;
  animation:orbit var(--d) linear infinite;transform-origin:center}
.emblem .orb img{width:100%;height:100%;display:block}
@keyframes emIn{from{opacity:0;transform:scale(.2) rotate(-200deg)}to{opacity:1;transform:none}}
@keyframes floaty{50%{transform:translateY(-8px) scale(1.02)}}
@keyframes orbit{from{transform:rotate(0) translateX(var(--r)) rotate(0)}to{transform:rotate(360deg) translateX(var(--r)) rotate(-360deg)}}

h1{font-size:clamp(2.6rem,9vw,6.4rem);line-height:1;letter-spacing:-.02em;font-weight:900;display:flex;flex-wrap:wrap;justify-content:center;gap:0 .02em}
h1 span{display:inline-block;opacity:0;transform:translateY(-120%) rotateX(90deg) scale(.4);
  animation:drop .7s cubic-bezier(.2,1.5,.4,1) forwards;
  background:linear-gradient(180deg,#fff 10%,var(--cy) 55%,var(--mg) 110%);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes drop{to{opacity:1;transform:none}}
.sub{margin-top:18px;max-width:640px;color:var(--mut);font-size:clamp(1rem,2.4vw,1.25rem);line-height:1.6;min-height:3.2em}
.sub .caret{display:inline-block;width:2px;height:1.1em;background:var(--cy);vertical-align:-.15em;margin-left:3px;animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.scroll{margin-top:34px;width:34px;height:56px;border:2px solid var(--mut);border-radius:20px;position:relative;margin-inline:auto;opacity:0;animation:fadeIn 1s 2.8s forwards}
.scroll::after{content:"";position:absolute;left:50%;top:10px;width:6px;height:10px;margin-left:-3px;border-radius:4px;background:var(--cy);animation:wheel 1.6s ease-in-out infinite}
@keyframes wheel{0%{transform:translateY(0);opacity:1}80%{transform:translateY(22px);opacity:0}100%{opacity:0}}
@keyframes fadeIn{to{opacity:1}}

/* GRID */
.title2{font-size:clamp(1.5rem,4vw,2.4rem);font-weight:800;margin:30px 0 26px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:26px;perspective:1100px}
.card{
  position:relative;border-radius:22px;padding:12px 12px 20px;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.14);
  transform-style:preserve-3d;transition:transform .25s ease,box-shadow .3s;
  opacity:0;transform:translateY(20px);will-change:transform,opacity;
}
.card.in{opacity:1;transform:none;transition:opacity .4s,transform .4s ease-out}
.card.live{transition:transform .15s ease-out,box-shadow .3s}
.card:hover{border-color:var(--cy);box-shadow:0 10px 30px -10px rgba(46,230,255,.5)}
.card .glow{position:absolute;inset:0;border-radius:22px;pointer-events:none;
  background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.2),transparent 60%);opacity:0;transition:opacity .3s}
.card:hover .glow{opacity:1}
.art{border-radius:14px;overflow:hidden;aspect-ratio:5/3;transform:translateZ(40px);box-shadow:0 18px 30px -12px rgba(0,0,0,.6)}
.art img{width:100%;height:100%;display:block;transition:transform .4s ease-out}
.card:hover .art img{transform:scale(1.08)}
.card h3{margin:16px 6px 4px;font-size:1.2rem;transform:translateZ(30px)}
.card p{margin:0 6px 16px;color:var(--mut);font-size:.92rem;line-height:1.45;min-height:2.8em;transform:translateZ(20px)}
.tag{position:absolute;top:22px;left:22px;z-index:3;padding:4px 11px;border-radius:99px;font-size:.75rem;font-weight:700;
  background:rgba(7,10,28,.7);border:1px solid rgba(255,255,255,.25);transform:translateZ(60px)}
.tag.on{color:#06231a;background:#3dffb0;border-color:#3dffb0;}

.btn{
  position:relative;display:block;overflow:hidden;text-align:center;text-decoration:none;color:#fff;font-weight:800;letter-spacing:.02em;
  padding:13px 16px;margin:0 6px;border-radius:14px;transform:translateZ(50px);
  background:linear-gradient(110deg,var(--vi),var(--mg) 50%,var(--am));
  transition:transform .2s;
}
.btn.soon{background:linear-gradient(110deg,#2a3170,#3d2a70);color:#c4cbff}
.btn::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);transition:left .7s}
.btn:hover::after{left:130%}
.btn:hover{filter:none}
.btn:hover{transform:translateZ(50px) scale(1.05);}
.btn:active{transform:translateZ(50px) scale(.97)}
.btn:focus-visible{outline:3px solid var(--cy);outline-offset:3px}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rip .7s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}

footer{margin-top:70px;text-align:center;color:var(--mut);font-size:.9rem}
.marquee{overflow:hidden;white-space:nowrap;margin-top:40px;}
.marquee div{display:inline-block;animation:mq 22s linear infinite;font-size:clamp(1.6rem,5vw,3rem);font-weight:900;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.35)}
@keyframes mq{to{transform:translateX(-50%)}}

/* page transition */
#curtain{position:fixed;inset:0;z-index:99;pointer-events:none;display:grid;grid-template-columns:repeat(5,1fr)}
#curtain i{background:linear-gradient(180deg,var(--vi),var(--mg));transform:scaleY(0);transform-origin:bottom;transition:transform .4s cubic-bezier(.7,0,.3,1)}
#curtain.go i{transform:scaleY(1)}
#curtain i:nth-child(2){transition-delay:.05s}#curtain i:nth-child(3){transition-delay:.1s}
#curtain i:nth-child(4){transition-delay:.15s}#curtain i:nth-child(5){transition-delay:.2s}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .card{opacity:1;transform:none}
}

/* ===== THANH TIẾN TRÌNH CUỘN (chỉ dùng transform → mượt, không gây layout) ===== */
#progress{position:fixed;top:0;left:0;right:0;height:4px;z-index:100;pointer-events:none;
  transform:scaleX(0);transform-origin:0 50%;will-change:transform;
  background:linear-gradient(90deg,var(--cy),var(--vi),var(--mg),var(--am));
  box-shadow:0 0 12px rgba(46,230,255,.6)}

/* ===== HIỆN DẦN KHI CUỘN (reveal) ===== */
.rv{opacity:0;transform:translateY(16px);transition:opacity .5s ease,transform .5s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.rv.up{opacity:0;transform:translateY(-16px)}
.card.up{opacity:0;transform:translateY(-20px);transition:opacity .35s,transform .35s ease-out}
#heroInner{will-change:opacity,transform}
.title2{position:relative}
.title2::after{content:"";display:block;width:70px;height:4px;margin:12px auto 0;border-radius:4px;
  background:linear-gradient(90deg,var(--cy),var(--mg));transform:scaleX(0);transition:transform .8s .25s cubic-bezier(.2,.8,.2,1)}
.title2.in::after{transform:scaleX(1)}

/* ===== NÚT ĐIỀU KHOẢN / BẢO MẬT Ở FOOTER ===== */
.f-links{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:18px}
.f-btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;border-radius:99px;
  color:#e3e7ff;text-decoration:none;font-weight:600;font-size:.85rem;
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);
  transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s,background .25s,box-shadow .25s}
.f-btn::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:left .6s}
.f-btn:hover{transform:translateY(-3px);border-color:var(--cy);background:rgba(46,230,255,.1);box-shadow:0 10px 24px -10px rgba(46,230,255,.55)}
.f-btn:hover::after{left:130%}
.f-btn:active{transform:translateY(0) scale(.97)}
.f-btn:focus-visible{outline:3px solid var(--cy);outline-offset:3px}
.f-btn i{font-style:normal;transition:transform .25s}
.f-btn:hover i{transform:translateX(3px)}
.f-copy{margin-top:18px;font-size:.82rem;opacity:.85}

/* ===== LÀM MƯỢT THÊM ===== */
.card{transition:transform .25s ease,box-shadow .3s,border-color .3s,opacity .35s}
.art img{opacity:0;transition:transform .4s ease-out,opacity .5s ease}
.art img.ld{opacity:1}
.emblem::after{content:"";position:absolute;inset:8%;border-radius:50%;z-index:-1;pointer-events:none;
  background:radial-gradient(circle,rgba(46,230,255,.28),transparent 68%);animation:glowp 5s ease-in-out infinite}
@keyframes glowp{50%{transform:scale(1.12);opacity:.65}}
@media (max-width:700px){.f-btn{flex:1 1 150px;justify-content:center}.emblem::after{animation:none}}
@media (prefers-reduced-motion:reduce){.rv,.rv.up,.card,.card.up,.title2::after{opacity:1!important;transform:none!important}#heroInner{opacity:1!important;transform:none!important}.art img{opacity:1}#progress{transition:none}}

/* ===== CHẶN BÔI ĐEN / COPY / KÉO ẢNH ===== */
html,body{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none}
img,svg,canvas,a{-webkit-user-drag:none;user-drag:none}
img{pointer-events:none;-webkit-touch-callout:none}
::selection{background:transparent}
::-moz-selection{background:transparent}

/* ===== HEADER + NÚT README ===== */
.topbar{position:fixed;top:4px;left:0;right:0;z-index:90;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));
  background:linear-gradient(180deg,rgba(7,10,28,.82),rgba(7,10,28,0));pointer-events:none}
.topbar>*{pointer-events:auto}
.tb-brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:800;letter-spacing:2px;font-size:.9rem}
.tb-mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#0c1024;font-weight:900;font-size:.8rem;letter-spacing:-1px;
  background:linear-gradient(135deg,var(--cy),#b6a1ff 55%,var(--mg));transform:rotate(-7deg)}
.readme-btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 18px;border-radius:99px;
  color:#fff;text-decoration:none;font-weight:700;font-size:.82rem;letter-spacing:.03em;
  border:1px solid rgba(255,255,255,.22);background:rgba(20,24,58,.85);
  transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s,box-shadow .25s,background .25s}
.readme-btn::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:left .6s}
.readme-btn:hover{transform:translateY(-2px);border-color:var(--cy);background:rgba(46,230,255,.14);box-shadow:0 10px 24px -10px rgba(46,230,255,.55)}
.readme-btn:hover::after{left:130%}
.readme-btn:active{transform:scale(.97)}
.readme-btn:focus-visible,.tb-brand:focus-visible{outline:3px solid var(--cy);outline-offset:3px}
.readme-btn svg{width:18px;height:18px;flex:none}
.hero{padding-top:76px!important}
@media (max-width:480px){.tb-brand span:last-child{display:none}.readme-btn{padding:0 14px}}

/* ===== CỬA SỔ BONG BÓNG README ===== */
.rm{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
.rm[hidden]{display:none}
.rm-bg{position:absolute;inset:0;background:rgba(3,5,18,.62);animation:rmFade .25s ease both}
.rm.closing .rm-bg{animation:rmFadeOut .2s ease both}
.rm-box{position:relative;width:min(720px,100%);max-height:min(82vh,820px);display:flex;flex-direction:column;overflow:hidden;outline:none;
  border-radius:28px;border:1px solid rgba(255,255,255,.2);
  background:linear-gradient(160deg,rgba(32,38,88,.97),rgba(14,17,42,.98));
  box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 6px rgba(46,230,255,.06),0 0 40px rgba(138,91,255,.25);
  transform-origin:var(--ox,90%) var(--oy,0%);animation:rmPop .42s cubic-bezier(.2,1.35,.4,1) both}
.rm.closing .rm-box{animation:rmOut .2s ease-in both}
@keyframes rmPop{0%{opacity:0;transform:scale(.15)}55%{opacity:1}100%{opacity:1;transform:none}}
@keyframes rmOut{to{opacity:0;transform:scale(.3)}}
@keyframes rmFade{from{opacity:0}}
@keyframes rmFadeOut{to{opacity:0}}
.rm-h{display:flex;align-items:center;gap:10px;padding:14px 14px 12px 20px;border-bottom:1px solid rgba(255,255,255,.1)}
.rm-h h2{flex:1;min-width:0;font-size:1rem;font-weight:800;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm-gh{flex:none;color:var(--cy);text-decoration:none;font-size:.78rem;font-weight:600;padding:8px 12px;border-radius:99px;border:1px solid rgba(46,230,255,.35)}
.rm-gh:hover{background:rgba(46,230,255,.12)}
.rm-x{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;font-size:1rem;cursor:pointer;transition:background .2s,transform .2s}
.rm-x:hover{background:rgba(255,61,166,.3);transform:rotate(90deg)}
.rm-x:focus-visible,.rm-gh:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
.rm-body{padding:18px 22px 24px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;color:#d4daf7;font-size:.95rem;line-height:1.75}
.rm-body h1,.rm-body h2,.rm-body h3,.rm-body h4{color:#fff;line-height:1.25;margin:1.1em 0 .45em}
.rm-body h1{font-size:1.6rem;margin-top:.2em}.rm-body h2{font-size:1.3rem}.rm-body h3{font-size:1.1rem}.rm-body h4{font-size:1rem}
.rm-body p{margin:.6em 0}
.rm-body a{color:var(--cy)}
.rm-body ul,.rm-body ol{margin:.6em 0 .6em 1.4em}
.rm-body li{margin:.25em 0}
.rm-body code{font-family:ui-monospace,Consolas,monospace;font-size:.88em;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.1)}
.rm-body pre{margin:.8em 0;padding:14px;border-radius:14px;background:rgba(0,0,0,.35);overflow-x:auto}
.rm-body pre code{padding:0;background:none}
.rm-body blockquote{margin:.8em 0;padding:.2em 14px;border-left:3px solid var(--vi);color:#b9c0ea}
.rm-body hr{border:0;height:1px;background:rgba(255,255,255,.14);margin:1.2em 0}
.rm-body img{max-width:100%;height:auto;border-radius:10px}
.rm-msg{text-align:center;color:var(--mut);padding:24px 0}
.rm-msg a{display:inline-block;margin-top:10px}
.rm-dots{display:inline-block;width:1.4em;text-align:left}
@media (max-width:600px){.rm{place-items:end center}.rm-box{border-radius:26px;max-height:86vh}.rm-gh{display:none}.rm-body{padding:16px 18px 22px}}
@media (prefers-reduced-motion:reduce){.rm-bg,.rm-box,.rm.closing .rm-box,.rm.closing .rm-bg{animation:none}}
</style>
</head>
<body>
<div id="progress" aria-hidden="true"></div>
<canvas id="fx"></canvas>
<div id="blobs"></div>
<div id="curtain"><i></i><i></i><i></i><i></i><i></i></div>

<header class="topbar">
  <a class="tb-brand" href="#" aria-label="SaveLab"><span class="tb-mark">SL</span><span>SAVELAB</span></a>
  <a class="readme-btn" id="rmBtn" aria-haspopup="dialog" href="https://github.com/MinhTruk/test/blob/main/README.md" target="_blank" rel="noopener noreferrer" title="Đọc README.md trên GitHub">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h12v17H6a2 2 0 0 0-2 2z"/><path d="M8 7h6M8 11h6"/></svg>
    Đọc README
  </a>
</header>

<div class="wrap">
  <header class="hero">
    <div id="heroInner">
      <div class="emblem" id="emblem"></div>
      <h1 id="title" aria-label="SaveLab"></h1>
      <p class="sub" id="sub" style="margin-inline:auto"></p>
      <div class="scroll"></div>
    </div>
  </header>

  <h2 class="title2 rv">Chọn công cụ</h2>
  <main class="grid" id="grid"></main>

  <div class="marquee rv"><div id="mq"></div></div>
  <footer class="rv">
    <nav class="f-links" aria-label="Pháp lý">
      <a class="f-btn" href="terms-of-service.html">Điều khoản dịch vụ <i aria-hidden="true">→</i></a>
      <a class="f-btn" href="privacy-policy.html">Chính sách bảo mật <i aria-hidden="true">→</i></a>
    </nav>
    <div class="f-copy">© <span id="year"></span> SaveLab · MinhTruk</div>
  </footer>
</div>

<div class="rm" id="rm" hidden>
  <div class="rm-bg" data-close></div>
  <section class="rm-box" id="rmBox" role="dialog" aria-modal="true" aria-labelledby="rmT" tabindex="-1">
    <header class="rm-h">
      <h2 id="rmT">📖 README.md</h2>
      <a class="rm-gh" href="https://github.com/MinhTruk/test/blob/main/README.md" target="_blank" rel="noopener noreferrer">Mở trên GitHub ↗</a>
      <button class="rm-x" type="button" data-close aria-label="Đóng">✕</button>
    </header>
    <div class="rm-body" id="rmBody"><p class="rm-msg">Đang tải…</p></div>
  </section>
</div>

<script>
/* ===== Cấu hình 10 nút ===== */
const TOOLS = [
  {name:"NSON / ES3 Decrypter", desc:"Giải mã & chỉnh sửa file save NSON, Easy Save 3.", href:"Save_Tool_NSON_ES3.html", hue:190},
  {name:"RMMZ Decrypter",       desc:"Đọc & sửa file save của RPG Maker MZ.",           href:"savelab_rmmz.html",      hue:320},
  {name:"RPG Maker Save Editor", desc:"Chỉnh sửa file save RPG Maker MV (.rpgsave).", href:"tool3.html",  hue:45},
  {name:"Ruby Marshal Inspector", desc:"Kiểm tra cấu trúc & dữ liệu save RGSS (.rxdata, .rvdata, .rvdata2).", href:"tool4.html",  hue:265},
  {name:"Công cụ 5", desc:"Sắp ra mắt.", href:"tool5.html",  hue:150},
  {name:"Công cụ 6", desc:"Sắp ra mắt.", href:"tool6.html",  hue:10},
  {name:"Công cụ 7", desc:"Sắp ra mắt.", href:"tool7.html",  hue:210},
  {name:"Công cụ 8", desc:"Sắp ra mắt.", href:"tool8.html",  hue:290},
  {name:"Công cụ 9", desc:"Sắp ra mắt.", href:"tool9.html",  hue:80},
  {name:"Công cụ 10",desc:"Sắp ra mắt.", href:"tool10.html", hue:340},
];

/* ===== Sinh ảnh SVG (dùng như <img>, có animation SMIL bên trong) ===== */
function rng(seed){let s=seed*9301+49297;return()=>((s=(s*9301+49297)%233280)/233280)}
function artSVG(seed,hue,w=500,h=300,anim=false){
  const r=rng(seed+3), h2=(hue+70)%360, h3=(hue+160)%360;
  let o=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}">
  <defs>
   <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${hue},85%,22%)"/><stop offset="1" stop-color="hsl(${h2},80%,12%)"/></linearGradient>
   <radialGradient id="r"><stop offset="0" stop-color="hsl(${h3},100%,70%)"/><stop offset="1" stop-color="hsl(${hue},100%,55%)" stop-opacity="0"/></radialGradient>
   <filter id="b"><feGaussianBlur stdDeviation="14"/></filter>
  </defs><rect width="${w}" height="${h}" fill="url(#g)"/>`;
  for(let i=0;i<5;i++){
    const cx=r()*w, cy=r()*h, rr=50+r()*90, dx=(r()-.5)*120, dy=(r()-.5)*80;
    o+=`<circle cx="${cx}" cy="${cy}" r="${rr}" fill="url(#r)" opacity=".8"/>`;
  }
  /* vòng quay trung tâm */
  o+=`<g transform="translate(${w/2} ${h/2})">`;
  for(let i=0;i<5;i++){
    const rad=30+i*26, dash=(8+r()*30).toFixed(0), dir=i%2?1:-1;
    o+=`<circle r="${rad}" fill="none" stroke="hsl(${(hue+i*35)%360},100%,${65+i*4}%)" stroke-width="${2+r()*3}" stroke-dasharray="${dash} ${dash*.8}" stroke-linecap="round" opacity=".9">${anim?`<animateTransform attributeName="transform" type="rotate" from="0" to="${360*dir}" dur="${6+i*3}s" repeatCount="indefinite"/>`:""}</circle>`;
  }
  o+=`<polygon points="0,-22 19,11 -19,11" fill="hsl(${h3},100%,75%)" opacity=".95"/></g>`;
  /* hạt sáng */
  for(let i=0;i<10;i++){
    const x=r()*w,y=r()*h;
    o+=`<circle cx="${x}" cy="${y}" r="${1+r()*2.5}" fill="#fff" opacity=".8"/>`;
  }
  return o+"</svg>";
}

const cards=[...document.querySelectorAll(".card")];
const io=new IntersectionObserver(es=>es.forEach(e=>{
  const c=e.target,i=cards.indexOf(c);
  clearTimeout(c._t);
  if(e.isIntersecting){
    c.classList.remove("up");
    c._t=setTimeout(()=>{c.classList.add("in");c._t=setTimeout(()=>c.classList.add("live"),700)},(i%4)*80);
  }else{
    c.classList.remove("in","live");c.style.transform="";
    c.classList.toggle("up",e.boundingClientRect.top<0); /* trôi lên trên → mờ lên; ở dưới → chờ hiện */
  }
}),{threshold:.12,rootMargin:"-8% 0px 0px 0px"});
cards.forEach(c=>io.observe(c));

/* nghiêng nhẹ theo chuột (throttle bằng rAF) */
cards.forEach(c=>{
  let raf=0,ev;
  c.addEventListener("mousemove",e=>{
    if(!c.classList.contains("live"))return;
    ev=e;if(raf)return;
    raf=requestAnimationFrame(()=>{raf=0;
      const b=c.getBoundingClientRect(),x=(ev.clientX-b.left)/b.width,y=(ev.clientY-b.top)/b.height;
      c.style.transform=`rotateY(${(x-.5)*6}deg) rotateX(${(.5-y)*6}deg)`;
      c.style.setProperty("--mx",x*100+"%");c.style.setProperty("--my",y*100+"%");
    });
  });
  c.addEventListener("mouseleave",()=>c.style.transform="");
});

/* ===== Canvas: hạt + tia nối + sao băng ===== */
(function(){
  const cv=document.getElementById("fx"),ctx=cv.getContext("2d");
  let W,H,P=[],M={x:-999,y:-999},S=[];
  function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;
    P=Array.from({length:Math.min(32,W/40|0)},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.42,vy:(Math.random()-.5)*.42,r:Math.random()*2+.6,h:Math.random()*360}))}
  size();addEventListener("resize",size);
  addEventListener("mousemove",e=>{M.x=e.clientX;M.y=e.clientY});
  function loop(){
    ctx.clearRect(0,0,W,H);
    for(const p of P){
      const dx=M.x-p.x,dy=M.y-p.y,d=Math.hypot(dx,dy);
      if(d<180){p.vx+=dx/d*.02;p.vy+=dy/d*.02}
      p.vx*=.99;p.vy*=.99;p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;
      ctx.fillStyle=`hsl(${p.h},100%,70%)`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
    }
    for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){
      const d=Math.hypot(P[i].x-P[j].x,P[i].y-P[j].y);
      if(d<100){ctx.strokeStyle=`rgba(120,160,255,${.22*(1-d/100)})`;ctx.beginPath();ctx.moveTo(P[i].x,P[i].y);ctx.lineTo(P[j].x,P[j].y);ctx.stroke()}
    }
    if(Math.random()<.003)S.push({x:Math.random()*W,y:-10,vx:-4-Math.random()*4,vy:5+Math.random()*4,l:1});
    for(let i=S.length-1;i>=0;i--){const s=S[i];s.x+=s.vx;s.y+=s.vy;s.l-=.012;
      const g=ctx.createLinearGradient(s.x,s.y,s.x-s.vx*9,s.y-s.vy*9);
      g.addColorStop(0,`rgba(255,255,255,${s.l})`);g.addColorStop(1,"rgba(255,255,255,0)");
      ctx.strokeStyle=g;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.vx*9,s.y-s.vy*9);ctx.stroke();
      if(s.l<=0)S.splice(i,1)}
    if(!document.hidden)requestAnimationFrame(loop);
  }
  loop();
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)loop()});
})();

(function(){
  const els=[...document.querySelectorAll(".rv")];
  if(!("IntersectionObserver" in window)){els.forEach(e=>e.classList.add("in"));return}
  const o=new IntersectionObserver(es=>es.forEach(e=>{

    if(e.isIntersecting){t.classList.remove("up");t.classList.add("in")}
    else{t.classList.remove("in");t.classList.toggle("up",e.boundingClientRect.top<0)}
  }),{threshold:.15,rootMargin:"-8% 0px 0px 0px"});

})();

/* ===== Thanh tiến trình cuộn trên đầu trang ===== */
(function(){
  const bar=document.getElementById("progress"),hi=document.getElementById("heroInner");let tick=false,lastP=-1;
  function upd(){
    tick=false;
    const max=document.documentElement.scrollHeight-innerHeight;
    bar.style.transform="scaleX("+(max>0?Math.min(1,Math.max(0,scrollY/max)):0)+")";
    const p=Math.min(1,scrollY/(innerHeight*.6));
    if(hi&&p!==lastP){lastP=p;
      if(p<=0){hi.style.opacity="";hi.style.transform=""}
      else{hi.style.opacity=(1-p).toFixed(3);hi.style.transform="translateY("+(-p*36).toFixed(1)+"px)"}}
  }
  function req(){if(!tick){tick=true;requestAnimationFrame(upd)}}
  addEventListener("scroll",req,{passive:true});
  addEventListener("resize",req);
  addEventListener("load",req);
  upd();
})();

/* ===== README dạng bong bóng: tải sẵn nền → bấm là hiện ngay ===== */
(function(){
  const RAW="https://raw.githubusercontent.com/MinhTruk/test/main/",GH="https://github.com/MinhTruk/test/blob/main/";
  const btn=document.getElementById("rmBtn"),root=document.getElementById("rm"),box=document.getElementById("rmBox"),body=document.getElementById("rmBody");
  let html=null,loading=null,last=null,closeT=0;

  const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const abs=(u,base)=>/^https?:\/\//i.test(u)?u:(/^[a-z][a-z0-9+.-]*:/i.test(u)||u[0]==="#"?"":base+u.replace(/^\.?\//,""));
  function inl(t){
    t=esc(t);
    t=t.replace(/`([^`]+)`/g,"<code>$1</code>");
    t=t.replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g,(m,a,u)=>{u=abs(u,RAW);return u?`<img alt="${a}" src="${u}" loading="lazy" decoding="async" referrerpolicy="no-referrer">`:""});
    t=t.replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g,(m,a,u)=>{u=abs(u,GH);return u?`<a href="${u}" target="_blank" rel="noopener noreferrer">${a}</a>`:a});
    t=t.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*\w])\*([^*]+)\*/g,"$1<em>$2</em>");
    return t;
  }
  function md(src){
    const L=src.replace(/\r\n?/g,"\n").split("\n"),o=[];let i=0;
    while(i<L.length){
      const l=L[i];
      if(/^\s*```/.test(l)){const b=[];i++;while(i<L.length&&!/^\s*```/.test(L[i]))b.push(L[i++]);i++;o.push("<pre><code>"+esc(b.join("\n"))+"</code></pre>");continue}
      let m;
      if((m=l.match(/^(#{1,4})\s+(.*)$/))){o.push(`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`);i++;continue}
      if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)){o.push("<hr>");i++;continue}
      if(/^\s*>/.test(l)){const b=[];while(i<L.length&&/^\s*>/.test(L[i]))b.push(L[i++].replace(/^\s*>\s?/,""));o.push("<blockquote>"+inl(b.join(" "))+"</blockquote>");continue}
      if(/^\s*([-*+]|\d+\.)\s+/.test(l)){
        const ord=/^\s*\d+\./.test(l),b=[];
        while(i<L.length&&/^\s*([-*+]|\d+\.)\s+/.test(L[i]))b.push("<li>"+inl(L[i++].replace(/^\s*([-*+]|\d+\.)\s+/,""))+"</li>");
        o.push((ord?"<ol>":"<ul>")+b.join("")+(ord?"</ol>":"</ul>"));continue}
      if(!l.trim()){i++;continue}
      const b=[];
      while(i<L.length&&L[i].trim()&&!/^(\s*```|#{1,4}\s|\s*>|\s*([-*+]|\d+\.)\s+)/.test(L[i]))b.push(L[i++]);
      o.push("<p>"+inl(b.join(" "))+"</p>");
    }
    return o.join("");
  }

  function load(){
    if(html!==null)return Promise.resolve();
    if(loading)return loading;
    loading=fetch(RAW+"README.md",{cache:"no-cache"}).then(r=>{if(!r.ok)throw 0;return r.text()})
      .then(t=>{html=t.trim()?md(t):'<p class="rm-msg">README.md đang trống.</p>';body.innerHTML=html})
      .catch(()=>{body.innerHTML='<p class="rm-msg">Không tải được README.<br><a href="'+GH+'README.md" target="_blank" rel="noopener noreferrer">Mở trên GitHub ↗</a></p>'})
      .finally(()=>{loading=null});
    return loading;
  }
  /* tải sẵn khi trình duyệt rảnh để lúc bấm là có nội dung ngay */
  (window.requestIdleCallback||(f=>setTimeout(f,1200)))(load);

  function open(e){
    clearTimeout(closeT);
    last=document.activeElement;
    const r=btn.getBoundingClientRect();
    root.hidden=false;root.classList.remove("closing");
    const b=box.getBoundingClientRect();
    box.style.setProperty("--ox",Math.max(0,Math.min(b.width,r.left+r.width/2-b.left))+"px");
    box.style.setProperty("--oy",Math.max(0,Math.min(b.height,r.top+r.height/2-b.top))+"px");
    if(html!==null)body.innerHTML=html;else{body.innerHTML='<p class="rm-msg">Đang tải…</p>';load()}
    body.scrollTop=0;
    document.documentElement.style.overflow="hidden";
    box.focus({preventScroll:true});
  }
  function close(){
    if(root.hidden||root.classList.contains("closing"))return;
    root.classList.add("closing");
    closeT=setTimeout(()=>{root.hidden=true;root.classList.remove("closing");document.documentElement.style.overflow="";
      if(last&&last.focus)last.focus({preventScroll:true})},matchMedia("(prefers-reduced-motion:reduce)").matches?0:200);
  }
  btn.addEventListener("click",e=>{if(e.ctrlKey||e.metaKey||e.shiftKey||e.button)return;e.preventDefault();open()});
  root.addEventListener("click",e=>{if(e.target.closest("[data-close]"))close()});
  document.addEventListener("keydown",e=>{
    if(root.hidden)return;
    if(e.key==="Escape"){close();return}
    if(e.key==="Tab"){ /* giữ focus trong cửa sổ */
      const f=[...box.querySelectorAll("a[href],button")].filter(x=>x.offsetParent);
      if(!f.length)return;const a=f[0],z=f[f.length-1];
      if(e.shiftKey&&(document.activeElement===a||document.activeElement===box)){e.preventDefault();z.focus()}
      else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
    }
  });
})();
</script>
