<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a1c">
<title>SaveLab – Bộ công cụ file save game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070a1c; --bg2:#0d1230; --ink:#eef1ff; --mut:#9aa4d6;
  --cy:#2ee6ff; --mg:#ff3da6; --am:#ffc247; --vi:#8a5bff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:radial-gradient(1200px 800px at 20% -10%,#1b1f5e 0%,transparent 60%),
             radial-gradient(1000px 700px at 100% 10%,#4a0f48 0%,transparent 55%),var(--bg);
  color:var(--ink);font-family:"Lexend","Segoe UI",Roboto,system-ui,sans-serif;
  min-height:100vh;overflow-x:hidden;
}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.blob{position:fixed;z-index:0;pointer-events:none;opacity:.3}
.blob img{display:block;width:100%;height:100%}
.wrap{position:relative;z-index:2;max-width:1200px;margin:0 auto;padding:0 22px 80px}

/* HERO */
.hero{min-height:92vh;display:grid;place-items:center;text-align:center;padding-top:40px;position:relative}
.emblem{position:relative;width:min(300px,62vw);aspect-ratio:1;margin:0 auto 18px;animation:emIn .8s cubic-bezier(.2,.8,.3,1) both}
.emblem .core{position:absolute;inset:0;width:100%;height:100%;animation:floaty 9s ease-in-out infinite}
.emblem .orb{position:absolute;width:26%;height:26%;left:37%;top:37%;border-radius:50%;overflow:hidden;
  animation:orbit var(--d) linear infinite;transform-origin:center}
.emblem .orb img{width:100%;height:100%;display:block}
@keyframes emIn{from{opacity:0;transform:scale(.65) rotate(-35deg)}to{opacity:1;transform:none}}
@keyframes floaty{50%{transform:translateY(-4px) scale(1.01)}}
@keyframes orbit{from{transform:rotate(0) translateX(var(--r)) rotate(0)}to{transform:rotate(360deg) translateX(var(--r)) rotate(-360deg)}}

h1{font-size:clamp(2.6rem,9vw,6.4rem);line-height:1;letter-spacing:-.02em;font-weight:900;display:flex;flex-wrap:wrap;justify-content:center;gap:0 .02em}
h1 span{display:inline-block;opacity:0;transform:translateY(-55%) rotateX(45deg) scale(.85);
  animation:drop .55s cubic-bezier(.2,.8,.4,1) forwards;
  background:linear-gradient(180deg,#fff 10%,var(--cy) 55%,var(--mg) 110%);-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes drop{to{opacity:1;transform:none}}
.sub{margin-top:18px;max-width:640px;color:var(--mut);font-size:clamp(1rem,2.4vw,1.25rem);line-height:1.6;min-height:3.2em}
.sub .caret{display:inline-block;width:2px;height:1.1em;background:var(--cy);vertical-align:-.15em;margin-left:3px;animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.scroll{margin-top:34px;width:34px;height:56px;border:2px solid var(--mut);border-radius:20px;position:relative;margin-inline:auto;opacity:0;animation:fadeIn .7s 2s forwards}
.scroll::after{content:"";position:absolute;left:50%;top:10px;width:6px;height:10px;margin-left:-3px;border-radius:4px;background:var(--cy);animation:wheel 2.2s ease-in-out infinite}
@keyframes wheel{0%{transform:translateY(0);opacity:1}80%{transform:translateY(16px);opacity:0}100%{opacity:0}}
@keyframes fadeIn{to{opacity:1}}

/* GRID */
.title2{font-size:clamp(1.5rem,4vw,2.4rem);font-weight:800;margin:30px 0 26px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:26px;perspective:1100px}
.card{
  position:relative;border-radius:22px;padding:12px 12px 20px;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.14);
  transform-style:preserve-3d;transition:transform .25s ease,box-shadow .3s;
  opacity:0;transform:translateY(12px);will-change:transform,opacity;
}
.card.in{opacity:1;transform:none;transition:opacity .32s,transform .32s ease-out}
.card.live{transition:transform .2s ease-out,box-shadow .3s}
.card:hover{border-color:var(--cy);box-shadow:0 10px 30px -10px rgba(46,230,255,.5)}
.card .glow{position:absolute;inset:0;border-radius:22px;pointer-events:none;
  background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.2),transparent 60%);opacity:0;transition:opacity .3s}
.card:hover .glow{opacity:1}
.art{border-radius:14px;overflow:hidden;aspect-ratio:5/3;transform:translateZ(40px);box-shadow:0 18px 30px -12px rgba(0,0,0,.6)}
.art img{width:100%;height:100%;display:block;transition:transform .4s ease-out}
.card:hover .art img{transform:scale(1.04)}
.card h3{margin:16px 6px 4px;font-size:1.2rem;transform:translateZ(30px)}
.card p{margin:0 6px 16px;color:var(--mut);font-size:.92rem;line-height:1.45;min-height:2.8em;transform:translateZ(20px)}
.tag{position:absolute;top:22px;left:22px;z-index:3;padding:4px 11px;border-radius:99px;font-size:.75rem;font-weight:700;
  background:rgba(7,10,28,.7);border:1px solid rgba(255,255,255,.25);transform:translateZ(60px)}
.tag.on{color:#06231a;background:#3dffb0;border-color:#3dffb0;}

.btn{
  position:relative;display:block;overflow:hidden;text-align:center;text-decoration:none;color:#fff;font-weight:800;letter-spacing:.02em;
  padding:13px 16px;margin:0 6px;border-radius:14px;transform:translateZ(50px);
  background:linear-gradient(110deg,var(--vi),var(--mg) 50%,var(--am));
  transition:transform .2s;
}
.btn.soon{background:linear-gradient(110deg,#2a3170,#3d2a70);color:#c4cbff}
.btn::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);transition:left .7s}
.btn:hover::after{left:130%}
.btn:hover{filter:none}
.btn:hover{transform:translateZ(50px) scale(1.025);}
.btn:active{transform:translateZ(50px) scale(.985)}
.btn:focus-visible{outline:3px solid var(--cy);outline-offset:3px}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rip .5s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}

footer{margin-top:70px;text-align:center;color:var(--mut);font-size:.9rem}
.marquee{overflow:hidden;white-space:nowrap;margin-top:40px;}
.marquee div{display:inline-block;will-change:transform;animation:mq 95s linear infinite;font-size:clamp(1.6rem,5vw,3rem);font-weight:900;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.35)}
@keyframes mq{to{transform:translateX(-50%)}}

/* page transition */
#curtain{position:fixed;inset:0;z-index:99;pointer-events:none;display:grid;grid-template-columns:repeat(5,1fr)}
#curtain i{background:linear-gradient(180deg,var(--vi),var(--mg));transform:scaleY(0);transform-origin:bottom;transition:transform .3s cubic-bezier(.7,0,.3,1)}
#curtain.go i{transform:scaleY(1)}
#curtain.nt i{transition:none}
#curtain.rev i{transform-origin:top}
#curtain i:nth-child(2){transition-delay:.035s}#curtain i:nth-child(3){transition-delay:.07s}
#curtain i:nth-child(4){transition-delay:.105s}#curtain i:nth-child(5){transition-delay:.14s}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .card{opacity:1;transform:none}
}

/* ===== THANH TIẾN TRÌNH CUỘN (chỉ dùng transform → mượt, không gây layout) ===== */
#progress{position:fixed;top:0;left:0;right:0;height:4px;z-index:100;pointer-events:none;
  transform:scaleX(0);transform-origin:0 50%;will-change:transform;
  background:linear-gradient(90deg,var(--cy),var(--vi),var(--mg),var(--am));
  box-shadow:0 0 12px rgba(46,230,255,.6)}

/* ===== HIỆN DẦN KHI CUỘN (reveal) ===== */
.rv{opacity:0;transform:translateY(10px);transition:opacity .38s ease,transform .38s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.rv.up{opacity:0;transform:translateY(-10px)}
.card.up{opacity:0;transform:translateY(-12px);transition:opacity .3s,transform .3s ease-out}
#heroInner{will-change:opacity,transform}
.title2{position:relative}
.title2::after{content:"";display:block;width:70px;height:4px;margin:12px auto 0;border-radius:4px;
  background:linear-gradient(90deg,var(--cy),var(--mg));transform:scaleX(0);transition:transform .55s .15s cubic-bezier(.2,.8,.2,1)}
.title2.in::after{transform:scaleX(1)}

/* ===== NÚT ĐIỀU KHOẢN / BẢO MẬT Ở FOOTER ===== */
.f-links{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:18px}
.f-btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;border-radius:99px;
  color:#e3e7ff;text-decoration:none;font-weight:600;font-size:.85rem;
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);
  transition:transform .2s ease,border-color .2s,background .2s,box-shadow .2s}
.f-btn::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:left .6s}
.f-btn:hover{transform:translateY(-2px);border-color:var(--cy);background:rgba(46,230,255,.1);box-shadow:0 10px 24px -10px rgba(46,230,255,.55)}
.f-btn:hover::after{left:130%}
.f-btn:active{transform:translateY(0) scale(.97)}
.f-btn:focus-visible{outline:3px solid var(--cy);outline-offset:3px}
.f-btn i{font-style:normal;transition:transform .25s}
.f-btn:hover i{transform:translateX(3px)}
.f-copy{margin-top:18px;font-size:.82rem;opacity:.85}

/* ===== LÀM MƯỢT THÊM ===== */
.card{transition:transform .25s ease,box-shadow .3s,border-color .3s,opacity .35s}
.art img{opacity:0;transition:transform .4s ease-out,opacity .5s ease}
.art img.ld{opacity:1}
.emblem::after{content:"";position:absolute;inset:8%;border-radius:50%;z-index:-1;pointer-events:none;
  background:radial-gradient(circle,rgba(46,230,255,.28),transparent 68%);animation:glowp 8s ease-in-out infinite}
@keyframes glowp{50%{transform:scale(1.06);opacity:.55}}
@media (max-width:700px){.f-btn{flex:1 1 150px;justify-content:center}.emblem::after{animation:none}}
@media (prefers-reduced-motion:reduce){.rv,.rv.up,.card,.card.up,.title2::after{opacity:1!important;transform:none!important}#heroInner{opacity:1!important;transform:none!important}.art img{opacity:1}#progress{transition:none}}

/* ===== CHẶN BÔI ĐEN / COPY / KÉO ẢNH ===== */
html,body{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none}
img,svg,canvas,a{-webkit-user-drag:none;user-drag:none}
img{pointer-events:none;-webkit-touch-callout:none}
::selection{background:transparent}
::-moz-selection{background:transparent}

/* ===== HEADER + NÚT README ===== */
.topbar{position:fixed;top:4px;left:0;right:0;z-index:90;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));
  background:linear-gradient(180deg,rgba(7,10,28,.82),rgba(7,10,28,0));pointer-events:none}
.topbar>*{pointer-events:auto}
.tb-brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:800;letter-spacing:2px;font-size:.9rem}
.tb-mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#0c1024;font-weight:900;font-size:.8rem;letter-spacing:-1px;
  background:linear-gradient(135deg,var(--cy),#b6a1ff 55%,var(--mg));transform:rotate(-7deg)}
.readme-btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 18px;border-radius:99px;
  color:#fff;text-decoration:none;font-weight:700;font-size:.82rem;letter-spacing:.03em;
  border:1px solid rgba(255,255,255,.22);background:rgba(20,24,58,.85);
  transition:transform .2s ease,border-color .2s,box-shadow .2s,background .2s}
.readme-btn::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);transition:left .6s}
.readme-btn:hover{transform:translateY(-1px);border-color:var(--cy);background:rgba(46,230,255,.14);box-shadow:0 10px 24px -10px rgba(46,230,255,.55)}
.readme-btn:hover::after{left:130%}
.readme-btn:active{transform:scale(.97)}
.readme-btn:focus-visible,.tb-brand:focus-visible{outline:3px solid var(--cy);outline-offset:3px}
.readme-btn svg{width:18px;height:18px;flex:none}
.hero{padding-top:76px!important}
@media (max-width:480px){.tb-brand span:last-child{display:none}.readme-btn{padding:0 14px}}

/* ===== CỬA SỔ BONG BÓNG README ===== */
.rm{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
.rm[hidden]{display:none}
.rm-bg{position:absolute;inset:0;background:rgba(3,5,18,.62);animation:rmFade .25s ease both}
.rm.closing .rm-bg{animation:rmFadeOut .2s ease both}
.rm-box{position:relative;width:min(720px,100%);max-height:min(82vh,820px);display:flex;flex-direction:column;overflow:hidden;outline:none;
  border-radius:28px;border:1px solid rgba(255,255,255,.2);
  background:linear-gradient(160deg,rgba(32,38,88,.97),rgba(14,17,42,.98));
  box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 6px rgba(46,230,255,.06),0 0 40px rgba(138,91,255,.25);
  transform-origin:var(--ox,90%) var(--oy,0%);animation:rmPop .3s cubic-bezier(.2,.8,.4,1) both}
.rm.closing .rm-box{animation:rmOut .2s ease-in both}
@keyframes rmPop{0%{opacity:0;transform:scale(.88)}100%{opacity:1;transform:none}}
@keyframes rmOut{to{opacity:0;transform:scale(.3)}}
@keyframes rmFade{from{opacity:0}}
@keyframes rmFadeOut{to{opacity:0}}
.rm-h{display:flex;align-items:center;gap:10px;padding:14px 14px 12px 20px;border-bottom:1px solid rgba(255,255,255,.1)}
.rm-h h2{flex:1;min-width:0;font-size:1rem;font-weight:800;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm-gh{flex:none;color:var(--cy);text-decoration:none;font-size:.78rem;font-weight:600;padding:8px 12px;border-radius:99px;border:1px solid rgba(46,230,255,.35)}
.rm-gh:hover{background:rgba(46,230,255,.12)}
.rm-x{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;font-size:1rem;cursor:pointer;transition:background .2s,transform .2s}
.rm-x:hover{background:rgba(255,61,166,.3);transform:rotate(90deg)}
.rm-x:focus-visible,.rm-gh:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
.rm-body{padding:18px 22px 24px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;color:#d4daf7;font-size:.95rem;line-height:1.75}
.rm-body h1,.rm-body h2,.rm-body h3,.rm-body h4{color:#fff;line-height:1.25;margin:1.1em 0 .45em}
.rm-body h1{font-size:1.6rem;margin-top:.2em}.rm-body h2{font-size:1.3rem}.rm-body h3{font-size:1.1rem}.rm-body h4{font-size:1rem}
.rm-body p{margin:.6em 0}
.rm-body a{color:var(--cy)}
.rm-body ul,.rm-body ol{margin:.6em 0 .6em 1.4em}
.rm-body li{margin:.25em 0}
.rm-body code{font-family:ui-monospace,Consolas,monospace;font-size:.88em;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.1)}
.rm-body pre{margin:.8em 0;padding:14px;border-radius:14px;background:rgba(0,0,0,.35);overflow-x:auto}
.rm-body pre code{padding:0;background:none}
.rm-body blockquote{margin:.8em 0;padding:.2em 14px;border-left:3px solid var(--vi);color:#b9c0ea}
.rm-body hr{border:0;height:1px;background:rgba(255,255,255,.14);margin:1.2em 0}
.rm-body img{max-width:100%;height:auto;border-radius:10px}
.rm-body h5{font-size:.95rem}.rm-body h6{font-size:.9rem;color:#b9c0ea}
.rm-body h5,.rm-body h6{color:#fff;line-height:1.25;margin:1.1em 0 .45em}
.rm-body h1,.rm-body h2{padding-bottom:.3em;border-bottom:1px solid rgba(255,255,255,.12)}
.rm-al{margin:.4em 0}
.rm-al img{display:inline-block;vertical-align:middle;margin:3px 2px}
.rm-body img[src*="shields.io"],.rm-body img[src*="badge"]{border-radius:5px}
.rm-body ul ul,.rm-body ol ul,.rm-body ul ol,.rm-body ol ol{margin:.2em 0 .2em 1.2em}
.rm-ck{font-size:1.05em}
.rm-tw{margin:.9em 0;overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:14px;border:1px solid rgba(255,255,255,.14)}
.rm-body table{border-collapse:collapse;width:100%;font-size:.88rem;line-height:1.5}
.rm-body th,.rm-body td{padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.1);text-align:left;vertical-align:top}
.rm-body th{color:#fff;font-weight:800;white-space:nowrap;background:linear-gradient(135deg,rgba(46,230,255,.16),rgba(138,91,255,.18))}
.rm-body tbody tr:nth-child(even) td{background:rgba(255,255,255,.035)}
.rm-body tbody tr:last-child td{border-bottom:0}
.rm-body tbody tr:hover td{background:rgba(46,230,255,.07)}
.rm-body kbd{font-family:ui-monospace,Consolas,monospace;font-size:.85em;padding:2px 6px;border-radius:6px;border:1px solid rgba(255,255,255,.25);border-bottom-width:2px;background:rgba(255,255,255,.08)}
.rm-body del{opacity:.65}
.rm-body details{margin:.8em 0;padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04)}
.rm-body summary{cursor:pointer;font-weight:700;color:#fff}
.rm-alert{border-left-width:4px}.rm-alert .rm-alt{font-weight:800;color:#fff;margin:.3em 0}
.rm-note{border-color:#4aa3ff}.rm-tip{border-color:#3dffb0}.rm-important{border-color:#b69cff}.rm-warning{border-color:#ffc94a}.rm-caution{border-color:#ff5c7a}
.rm-body{scroll-behavior:smooth}
.rm-msg{text-align:center;color:var(--mut);padding:24px 0}
.rm-msg a{display:inline-block;margin-top:10px}
.rm-live{display:inline-flex;align-items:center;gap:6px;font-size:.68rem;color:var(--mut);font-weight:600}
.rm-live i{width:6px;height:6px;border-radius:50%;background:#3dffb0;box-shadow:0 0 8px #3dffb0;flex:none;animation:rmLive 1.8s ease-in-out infinite}
@keyframes rmLive{50%{opacity:.35;transform:scale(.7)}}
@media (max-width:600px){.rm{place-items:end center}.rm-box{border-radius:26px;max-height:86vh}.rm-gh{display:none}.rm-body{padding:16px 18px 22px}}
@media (prefers-reduced-motion:reduce){.rm-bg,.rm-box,.rm.closing .rm-box,.rm.closing .rm-bg{animation:none}}
</style>
</head>
<body>
<div id="progress" aria-hidden="true"></div>
<canvas id="fx"></canvas>
<div id="blobs"></div>
<div id="curtain"><i></i><i></i><i></i><i></i><i></i></div>
<script>(function(){try{var t=+sessionStorage.getItem("sl-cv");sessionStorage.removeItem("sl-cv");if(!t||Date.now()-t>4000)return;var c=document.getElementById("curtain");c.className="go nt";c.offsetWidth;requestAnimationFrame(function(){requestAnimationFrame(function(){c.className="rev";setTimeout(function(){c.classList.remove("rev")},800)})})}catch(e){}})()</script>

<header class="topbar">
  <a class="tb-brand" href="#" aria-label="SaveLab"><span class="tb-mark">SL</span><span>SAVELAB</span></a>
  <a class="readme-btn" id="rmBtn" aria-haspopup="dialog" href="https://github.com/MinhTruk/test/blob/main/README.md" target="_blank" rel="noopener noreferrer" title="Đọc README.md trên GitHub">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h12v17H6a2 2 0 0 0-2 2z"/><path d="M8 7h6M8 11h6"/></svg>
    Đọc README
  </a>
</header>

<div class="wrap">
  <header class="hero">
    <div id="heroInner">
      <div class="emblem" id="emblem"></div>
      <h1 id="title" aria-label="SaveLab"></h1>
      <p class="sub" id="sub" style="margin-inline:auto"></p>
      <div class="scroll"></div>
    </div>
  </header>

  <h2 class="title2 rv">Chọn công cụ</h2>
  <main class="grid" id="grid"></main>

  <div class="marquee rv"><div id="mq"></div></div>
  <footer class="rv">
    <nav class="f-links" aria-label="Pháp lý">

/* ===== Sinh ảnh SVG (dùng như <img>, có animation SMIL bên trong) ===== */
function rng(seed){let s=seed*9301+49297;return()=>((s=(s*9301+49297)%233280)/233280)}
function artSVG(seed,hue,w=500,h=300,anim=false){
  const r=rng(seed+3), h2=(hue+70)%360, h3=(hue+160)%360;
  let o=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}">
  <defs>
   <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${hue},85%,22%)"/><stop offset="1" stop-color="hsl(${h2},80%,12%)"/></linearGradient>
   <radialGradient id="r"><stop offset="0" stop-color="hsl(${h3},100%,70%)"/><stop offset="1" stop-color="hsl(${hue},100%,55%)" stop-opacity="0"/></radialGradient>
   <filter id="b"><feGaussianBlur stdDeviation="14"/></filter>
  </defs><rect width="${w}" height="${h}" fill="url(#g)"/>`;
  for(let i=0;i<5;i++){
    const cx=r()*w, cy=r()*h, rr=50+r()*90, dx=(r()-.5)*120, dy=(r()-.5)*80;
    o+=`<circle cx="${cx}" cy="${cy}" r="${rr}" fill="url(#r)" opacity=".8"/>`;
  }
  /* vòng quay trung tâm */
  o+=`<g transform="translate(${w/2} ${h/2})">`;
  for(let i=0;i<5;i++){
    const rad=30+i*26, dash=(8+r()*30).toFixed(0), dir=i%2?1:-1;
    o+=`<circle r="${rad}" fill="none" stroke="hsl(${(hue+i*35)%360},100%,${65+i*4}%)" stroke-width="${2+r()*3}" stroke-dasharray="${dash} ${dash*.8}" stroke-linecap="round" opacity=".9">${anim?`<animateTransform attributeName="transform" type="rotate" from="0" to="${360*dir}" dur="${12+i*4}s" repeatCount="indefinite"/>`:""}</circle>`;
  }
  o+=`<polygon points="0,-22 19,11 -19,11" fill="hsl(${h3},100%,75%)" opacity=".95"/></g>`;
  /* hạt sáng */
  for(let i=0;i<10;i++){
    const x=r()*w,y=r()*h;
    o+=`<circle cx="${x}" cy="${y}" r="${1+r()*2.5}" fill="#fff" opacity=".8"/>`;
  }
  return o+"</svg>";
}

/* ===== Canvas: hạt + tia nối + cánh hoa anh đào rơi (tối ưu: dt, sprite, ngắt khi ẩn) ===== */
(function(){
  const cv=document.getElementById("fx"),ctx=cv.getContext("2d",{alpha:true});
  const calm=matchMedia("(prefers-reduced-motion:reduce)").matches;
  const REST=3000,FADE=700,MAX_FALL=46,MAX_ALL=70,LINK=80,LINK2=LINK*LINK;
  let W=0,H=0,P=[],F=[],M={x:-999,y:-999},last=0,run=false,spawnAcc=0;

  /* sprite cánh hoa vẽ sẵn 1 lần → drawImage nhanh hơn vẽ path mỗi khung */
  const SP=48,spr=document.createElement("canvas");spr.width=spr.height=SP;
  (function(){const c=spr.getContext("2d"),s=SP*.42,g=c.createLinearGradient(0,-s,0,s);
    g.addColorStop(0,"#ffd3e4");g.addColorStop(1,"#ff9cc4");
    c.translate(SP/2,SP/2);c.fillStyle=g;c.beginPath();
    c.moveTo(0,-s);c.quadraticCurveTo(s*.9,-s*.2,0,s);c.quadraticCurveTo(-s*.9,-s*.2,0,-s);c.fill()})();

  function size(){
    W=cv.width=innerWidth;H=cv.height=innerHeight;
    const n=calm?0:Math.min(18,Math.round(W/70));
    P=Array.from({length:n},()=>{const h=Math.random()*360;
      return{x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*20,vy:(Math.random()-.5)*20,r:Math.random()*1.8+.6,c:`hsl(${h|0},100%,70%)`}});
    F.forEach(f=>{if(f.rest)f.y=H-f.s-f.off});
  }
  size();addEventListener("resize",size,{passive:true});
  addEventListener("mousemove",e=>{M.x=e.clientX;M.y=e.clientY},{passive:true});

  function spawn(){
    const s=4+Math.random()*5;
    F.push({x:Math.random()*W,y:-14,s,vy:20+Math.random()*24,sway:Math.random()*6.28,swaySpd:.7+Math.random()*1,swayAmp:14+Math.random()*22,
      rot:Math.random()*7,rotSpd:(Math.random()-.5)*1.4,off:Math.random()*10,rest:false,t0:0,a:1});
  }

  function frame(now){
    if(!run)return;
    const dt=Math.min(.05,(now-(last||now))/1000);last=now;
    ctx.clearRect(0,0,W,H);

    /* hạt + tia nối */
    const damp=Math.pow(.99,dt*60);
    for(const p of P){
      const dx=M.x-p.x,dy=M.y-p.y,d2=dx*dx+dy*dy;
      if(d2<19600&&d2>1){const d=Math.sqrt(d2),k=.7*dt*60;p.vx+=dx/d*k;p.vy+=dy/d*k}
      p.vx*=damp;p.vy*=damp;p.x+=p.vx*dt;p.y+=p.vy*dt;
      if(p.x<0)p.x=W;else if(p.x>W)p.x=0;if(p.y<0)p.y=H;else if(p.y>H)p.y=0;
      ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();
    }
    ctx.lineWidth=1;
    for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){
      const dx=P[i].x-P[j].x,dy=P[i].y-P[j].y,d2=dx*dx+dy*dy;
      if(d2<LINK2){ctx.strokeStyle=`rgba(120,160,255,${(.16*(1-Math.sqrt(d2)/LINK)).toFixed(3)})`;ctx.beginPath();ctx.moveTo(P[i].x,P[i].y);ctx.lineTo(P[j].x,P[j].y);ctx.stroke()}
    }

    /* hoa anh đào: rơi → nằm lại ở đáy 3s → mờ dần rồi biến mất */
    if(!calm){
      let falling=0;for(const f of F)if(!f.rest)falling++;
      spawnAcc+=dt*3.2;                       /* ~3 cánh/giây */
      while(spawnAcc>=1){spawnAcc--;if(falling<MAX_FALL&&F.length<MAX_ALL){spawn();falling++}}
    }
    for(let i=F.length-1;i>=0;i--){
      const f=F[i];
      if(!f.rest){
        f.sway+=f.swaySpd*dt;f.y+=f.vy*dt;f.x+=Math.sin(f.sway)*f.swayAmp*dt*.9;f.rot+=f.rotSpd*dt;
        f.a=f.y<40?Math.max(0,f.y/40):1;
        const floor=H-f.s-f.off;
        if(f.y>=floor){f.y=floor;f.rest=true;f.t0=now;f.rotSpd=0;f.a=1}
      }else{
        const t=now-f.t0;
        if(t>REST+FADE){F.splice(i,1);continue}
        f.a=t>REST?1-(t-REST)/FADE:1;
      }
      ctx.globalAlpha=f.a*.9;
      const k=f.s/(SP*.42);                   /* tỉ lệ sprite → kích thước cánh */
      ctx.setTransform(Math.cos(f.rot)*k,Math.sin(f.rot)*k,-Math.sin(f.rot)*k,Math.cos(f.rot)*k,f.x,f.y);
      ctx.drawImage(spr,-SP/2,-SP/2);
    }
    ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;
    requestAnimationFrame(frame);
  }
  function start(){if(run||document.hidden)return;run=true;last=0;requestAnimationFrame(frame)}
  function stop(){run=false}
  document.addEventListener("visibilitychange",()=>document.hidden?stop():start());
  start();
})();

/* ===== README dạng bong bóng: luôn lấy bản mới nhất mỗi lần mở (stale-while-revalidate) ===== */
(function(){
  const RAW="https://raw.githubusercontent.com/MinhTruk/test/main/",GH="https://github.com/MinhTruk/test/blob/main/";
  const btn=document.getElementById("rmBtn"),root=document.getElementById("rm"),box=document.getElementById("rmBox"),body=document.getElementById("rmBody"),live=document.getElementById("rmLive");
  let cached=null,last=null,closeT=0,inflight=null;

  const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const abs=(u,base)=>/^https?:\/\//i.test(u)?u:(/^[a-z][a-z0-9+.-]*:/i.test(u)||u[0]==="#"?"":base+u.replace(/^\.?\//,""));
  const slug=s=>"rm-"+s.replace(/<[^>]*>/g,"").toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu,"").replace(/\s/g,"-");
  const attrs=s=>{const r={};s.replace(/([a-z-]+)\s*=\s*(?:&quot;(.*?)&quot;|'(.*?)')/gi,(m,k,a,b)=>{r[k.toLowerCase()]=a!==undefined?a:b;return m});return r};
  const dim=v=>/^\d{1,4}%?$/.test(v||"")?v:"";
  const aOpen=u=>u[0]==="#"?`<a href="#${slug(u.slice(1)).replace(/^rm-/,"rm-")}" data-a>`:((u=abs(u,GH))?`<a href="${u}" target="_blank" rel="noopener noreferrer">`:"");
  const IMG=(a,u)=>`<img alt="${a}" src="${u}" loading="lazy" decoding="async" referrerpolicy="no-referrer">`;
  const TITLE="(?:\\s+(?:&quot;[^)]*?&quot;|'[^)]*?'))?";

  function inl(t){
    const st=[],S=h=>"\u0001"+(st.push(h)-1)+"\u0002";
    t=esc(t);
    t=t.replace(/`([^`]+)`/g,(m,c)=>S("<code>"+c+"</code>"));
    t=t.replace(/&lt;!--[\s\S]*?--&gt;/g,"");
    /* <img ...> */
    t=t.replace(/&lt;img\b((?:(?!&gt;)[\s\S])*?)\/?&gt;/gi,(m,a)=>{
      const o=attrs(a),u=abs(o.src||"",RAW);if(!u)return"";
      const w=dim(o.width),h=dim(o.height);
      return S(`<img alt="${o.alt||""}" src="${u}"${w?` width="${w}"`:""}${h?` height="${h}"`:""} loading="lazy" decoding="async" referrerpolicy="no-referrer">`)});
    /* <a href> ... </a> */
    const aSt=[];
    t=t.replace(/&lt;(\/?)a\b((?:(?!&gt;)[\s\S])*?)&gt;/gi,(m,c,a)=>{
      if(c)return S(aSt.pop()||"");
      const o=attrs(a),op=o.href?aOpen(o.href):"";aSt.push(op?"</a>":"");return S(op)});
    t=t.replace(/&lt;(\/?)(b|strong|i|em|u|s|del|ins|kbd|sub|sup|mark|small)&gt;/gi,(m,c,n)=>S("<"+c+n.toLowerCase()+">"));
    t=t.replace(/&lt;br\s*\/?&gt;/gi,()=>S("<br>"));
    t=t.replace(/&lt;\/?(?:span|font|center|p|div|picture|source|summary|details)\b(?:(?!&gt;)[\s\S])*?&gt;/gi,"");
    /* ![alt](src) và [text](url) — kể cả [![badge](img)](url) */
    t=t.replace(new RegExp("!\\[([^\\]]*)\\]\\(\\s*([^)\\s]+)"+TITLE+"\\s*\\)","g"),(m,a,u)=>{u=abs(u,RAW);return u?S(IMG(a,u)):""});
    t=t.replace(new RegExp("\\[([^\\]]+)\\]\\(\\s*([^)\\s]+)"+TITLE+"\\s*\\)","g"),(m,a,u)=>{const o=aOpen(u);return o?S(o)+a+S("</a>"):a});
    /* link trần */
    t=t.replace(/(^|[\s(])(https?:\/\/[^\s<]+?)(?=[.,;:!?)]*(?:\s|$))/g,(m,p,u)=>p+S(`<a href="${u}" target="_blank" rel="noopener noreferrer">`)+u+S("</a>"));
    t=t.replace(/\*\*\*(.+?)\*\*\*/g,"<strong><em>$1</em></strong>")
       .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
       .replace(/(^|[^\w])__(.+?)__(?=[^\w]|$)/g,"$1<strong>$2</strong>")
       .replace(/~~(.+?)~~/g,"<del>$1</del>")
       .replace(/(^|[^*\w])\*(?!\s)([^*]+?)\*(?!\w)/g,"$1<em>$2</em>")
       .replace(/(^|[^\w])_(?!\s)([^_]+?)_(?=[^\w]|$)/g,"$1<em>$2</em>");
    let n=0;while(/\u0001\d+\u0002/.test(t)&&n++<5)t=t.replace(/\u0001(\d+)\u0002/g,(m,i)=>st[i]);
    return t.replace(/\n/g,"<br>");
  }

  const LI=/^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/,
        WR=/^\s*<(\/?)(p|div|center|details)\b([^>]*)>\s*$/i,
        SUM=/^\s*<summary[^>]*>(.*)<\/summary>\s*$/i,
        HH=/^\s*<h([1-6])\b([^>]*)>(.*?)<\/h\1>\s*$/i,
        HR=/^\s*([-*_])(\s*\1){2,}\s*$/,
        DELIM=/^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/,
        FENCE=/^\s*```/;
  /* tách các thẻ <p align>, <div>, <center>, <details> ra dòng riêng (bỏ qua code) */
  function norm(L){
    const o=[];let f=false;
    for(const l of L){
      if(FENCE.test(l)){f=!f;o.push(l);continue}
      if(f||l.indexOf("`")>-1||!/<\/?(p|div|center|details)\b/i.test(l)){o.push(l);continue}
      l.replace(/(<\/?(?:p|div|center|details)\b[^>]*>)/gi,"\n$1\n").split("\n").forEach(x=>{if(x.trim())o.push(x)});
    }
    return o;
  }
  function cells(l){
    l=l.trim().replace(/^\|/,"").replace(/\|$/,"");
    const c=[];let cur="",tk=false;
    for(let k=0;k<l.length;k++){const ch=l[k];
      if(ch==="\\"&&l[k+1]==="|"){cur+="|";k++;continue}
      if(ch==="`")tk=!tk;
      if(ch==="|"&&!tk){c.push(cur.trim());cur=""}else cur+=ch}
    c.push(cur.trim());return c;
  }
  function md(src,sub){
    let L=src.replace(/\r\n?/g,"\n").replace(/\t/g,"    ").replace(/<!--[\s\S]*?-->/g,"").split("\n");
    if(!sub)L=norm(L);
    const o=[],stack=[];let i=0;
    const isTable=k=>k+1<L.length&&L[k].includes("|")&&DELIM.test(L[k+1])&&L[k+1].includes("-");
    const isBlock=k=>{const l=L[k];return FENCE.test(l)||WR.test(l)||SUM.test(l)||HH.test(l)||/^#{1,6}\s/.test(l)||HR.test(l)||/^\s*>/.test(l)||LI.test(l)||isTable(k)};
    const head=(n,txt,al)=>{const h=inl(txt.replace(/\s+#+\s*$/,""));return `<h${n} id="${slug(txt)}"${al?` style="text-align:${al}"`:""}>${h}</h${n}>`};

    function list(ind){
      const first=L[i].match(LI),ord=/^\d/.test(first[2]),tag=ord?"ol":"ul";let h="";
      while(i<L.length){
        let m=L[i].match(LI);
        if(!m){ /* bỏ dòng trống giữa các mục cùng cấp */
          let k=i;while(k<L.length&&!L[k].trim())k++;
          const mm=k>i&&k<L.length&&L[k].match(LI);
          if(mm&&mm[1].length===ind){i=k;continue}
          break}
        if(m[1].length!==ind)break;
        let txt=m[3],sub="";i++;
        for(;;){
          if(i>=L.length)break;
          if(!L[i].trim()){let k=i;while(k<L.length&&!L[k].trim())k++;const mm=k<L.length&&L[k].match(LI);if(mm&&mm[1].length>ind){i=k;continue}break}
          const mm=L[i].match(LI);
          if(mm&&mm[1].length>ind){sub+=list(mm[1].length);continue}
          if(mm)break;
          if(/^\s{2,}\S/.test(L[i])&&!isBlock(i)){txt+=" "+L[i].trim();i++;continue}
          break}
        let box="";
        txt=txt.replace(/^\[( |x|X)\]\s+/,(q,c)=>{box=`<span class="rm-ck">${c===" "?"☐":"☑"}</span> `;return""});
        h+="<li>"+box+inl(txt)+sub+"</li>";
      }
      return `<${tag}>${h}</${tag}>`;
    }

    while(i<L.length){
      const l=L[i];let m;
      if(!l.trim()){i++;continue}
      if(FENCE.test(l)){const b=[];i++;while(i<L.length&&!FENCE.test(L[i]))b.push(L[i++]);i++;o.push("<pre><code>"+esc(b.join("\n"))+"</code></pre>");continue}
      if((m=l.match(WR))){
        const tg=m[2].toLowerCase(),kind=tg==="details"?"details":"div";
        if(m[1]){const k=stack.map(s=>s.kind).lastIndexOf(kind);if(k>-1){while(stack.length>k)o.push(stack.pop().close)}}
        else{
          const a=tg==="center"?"center":((m[3].match(/align\s*=\s*["']?(center|left|right)/i)||[])[1]||"").toLowerCase();
          o.push(kind==="details"?"<details>":`<div class="rm-al"${a?` style="text-align:${a}"`:""}>`);
          stack.push({kind,close:kind==="details"?"</details>":"</div>"});
        }
        i++;continue}
      if((m=l.match(SUM))){o.push("<summary>"+inl(m[1])+"</summary>");i++;continue}
      if((m=l.match(HH))){const al=((m[2].match(/align\s*=\s*["']?(center|left|right)/i)||[])[1]||"").toLowerCase();o.push(head(+m[1],m[3].replace(/<[^>]+>/g,""),al));i++;continue}
      if((m=l.match(/^(#{1,6})\s+(.*)$/))){o.push(head(m[1].length,m[2]));i++;continue}
      if(HR.test(l)){o.push("<hr>");i++;continue}
      if(isTable(i)){
        const hd=cells(l),al=cells(L[i+1]).map(c=>/^:-+:$/.test(c)?"center":/-:$/.test(c)?"right":/^:/.test(c)?"left":"");
        i+=2;const rows=[];
        while(i<L.length&&L[i].trim()&&L[i].includes("|")&&!FENCE.test(L[i]))rows.push(cells(L[i++]));
        const st=k=>al[k]?` style="text-align:${al[k]}"`:"";
        o.push('<div class="rm-tw"><table><thead><tr>'+hd.map((c,k)=>`<th${st(k)}>${inl(c)}</th>`).join("")+"</tr></thead><tbody>"+
          rows.map(r=>"<tr>"+hd.map((_,k)=>`<td${st(k)}>${inl(r[k]||"")}</td>`).join("")+"</tr>").join("")+"</tbody></table></div>");
        continue}
      if(/^\s*>/.test(l)){
        const b=[];while(i<L.length&&/^\s*>/.test(L[i]))b.push(L[i++].replace(/^\s*>\s?/,""));
        let cls="",lab="";const am=(b[0]||"").match(/^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*$/i);
        if(am){cls=" class=\"rm-alert rm-"+am[1].toLowerCase()+"\"";lab="<p class=\"rm-alt\">"+({note:"ℹ️ Note",tip:"💡 Tip",important:"❗ Important",warning:"⚠️ Warning",caution:"🛑 Caution"})[am[1].toLowerCase()]+"</p>";b.shift()}
        o.push("<blockquote"+cls+">"+lab+md(b.join("\n"),true)+"</blockquote>");continue}
      if(LI.test(l)){o.push(list(l.match(LI)[1].length));continue}
      const b=[];
      while(i<L.length&&L[i].trim()&&(b.length===0||!isBlock(i))){
        const x=L[i++];const hard=/( {2,}|\\)$/.test(x);
        b.push(x.replace(/\\$/,"").trim()+(hard?"\n":" "));
      }
      o.push("<p>"+inl(b.join("").replace(/ $/,"")).replace(/<br> /g,"<br>")+"</p>");
    }
    while(stack.length)o.push(stack.pop().close);
    return o.join("");
  }

  /* luôn fetch bản mới nhất (cache:'no-store' + chống cache CDN bằng query theo thời gian) */
  function fetchFresh(){
    return fetch(RAW+"README.md?_="+Date.now(),{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.text()})
      .then(t=>{const h=t.trim()?md(t):'<p class="rm-msg">README.md đang trống.</p>';cached=h;return h});
  }
  function refresh(showSpinner){
    if(inflight)return inflight;
    if(showSpinner&&live)live.hidden=false;
    inflight=fetchFresh()
      .then(h=>{if(!root.hidden)body.innerHTML=h})
      .catch(()=>{if(!root.hidden&&cached===null)body.innerHTML='<p class="rm-msg">Không tải được README.<br><a href="'+GH+'README.md" target="_blank" rel="noopener noreferrer">Mở trên GitHub ↗</a></p>'})
      .finally(()=>{inflight=null;if(live)live.hidden=true});
    return inflight;
  }
  /* làm nóng cache khi trình duyệt rảnh, để mở lần đầu cũng nhanh */
  (window.requestIdleCallback||(f=>setTimeout(f,1200)))(()=>refresh(false));

  function open(){
    clearTimeout(closeT);
    last=document.activeElement;
    const r=btn.getBoundingClientRect();
    root.hidden=false;root.classList.remove("closing");
    const b=box.getBoundingClientRect();
    box.style.setProperty("--ox",Math.max(0,Math.min(b.width,r.left+r.width/2-b.left))+"px");
    box.style.setProperty("--oy",Math.max(0,Math.min(b.height,r.top+r.height/2-b.top))+"px");
    body.innerHTML=cached!==null?cached:'<p class="rm-msg">Đang tải…</p>';
    body.scrollTop=0;
    document.documentElement.style.overflow="hidden";
    box.focus({preventScroll:true});
    /* mỗi lần mở đều hỏi lại GitHub để chắc chắn luôn thấy bản mới nhất */
    refresh(true);
  }
  function close(){
    if(root.hidden||root.classList.contains("closing"))return;
    root.classList.add("closing");
    closeT=setTimeout(()=>{root.hidden=true;root.classList.remove("closing");document.documentElement.style.overflow="";
      if(last&&last.focus)last.focus({preventScroll:true})},matchMedia("(prefers-reduced-motion:reduce)").matches?0:200);
  }
  /* link nội bộ (#mục) cuộn ngay trong cửa sổ README */
  body.addEventListener("click",e=>{const a=e.target.closest("a[data-a]");if(!a)return;e.preventDefault();
    try{const id=decodeURIComponent(a.getAttribute("href").slice(1)).replace(/["\\]/g,"");const t=body.querySelector('[id="'+id+'"]');if(t)t.scrollIntoView({behavior:"smooth",block:"start"})}catch(_){}});
  btn.addEventListener("click",e=>{if(e.ctrlKey||e.metaKey||e.shiftKey||e.button)return;e.preventDefault();open()});
  root.addEventListener("click",e=>{if(e.target.closest("[data-close]"))close()});
  document.addEventListener("keydown",e=>{
    if(root.hidden)return;
    if(e.key==="Escape"){close();return}
    if(e.key==="Tab"){
      const f=[...box.querySelectorAll("a[href],button")].filter(x=>x.offsetParent);
      if(!f.length)return;const a=f[0],z=f[f.length-1];
      if(e.shiftKey&&(document.activeElement===a||document.activeElement===box)){e.preventDefault();z.focus()}
      else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
    }
  });
  /* mở lại trang (quay lại tab) → làm mới cache ngầm, không làm phiền nếu đang đóng */
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh(false)});
})();
</script>
</body>
</html>
