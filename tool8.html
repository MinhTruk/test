<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Công cụ 8 – SaveLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;text-align:center;color:#eef1ff;font-family:"Lexend","Segoe UI",Roboto,system-ui,sans-serif;
background:radial-gradient(900px 600px at 20% 0%,#1b1f5e,transparent 60%),radial-gradient(800px 600px at 100% 100%,#4a0f48,transparent 55%),#070a1c;overflow:hidden}
.ring{width:140px;height:140px;margin:0 auto 26px;border-radius:50%;border:6px solid transparent;border-top-color:#2ee6ff;border-right-color:#ff3da6;animation:r 1.4s linear infinite;box-shadow:0 0 40px rgba(46,230,255,.4)}
@keyframes r{to{transform:rotate(360deg)}}
h1{font-size:clamp(2rem,6vw,3.6rem);animation:in .8s cubic-bezier(.2,1.4,.4,1) both}
p{color:#9aa4d6;margin:12px 0 28px}
a{display:inline-block;color:#fff;text-decoration:none;font-weight:800;padding:13px 28px;border-radius:14px;background:linear-gradient(110deg,#8a5bff,#ff3da6);transition:transform .2s}
a:hover{transform:scale(1.07)}
@keyframes in{from{opacity:0;transform:translateY(-40px) scale(.6)}}
</style>
</head>
<body>
<div><div class="ring"></div><h1>Công cụ 8</h1><p>Trang này đang chờ nội dung. Sẽ cập nhật sau.</p><a href="index.html">Về trang chủ</a></div>
</body>
</html>
